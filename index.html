<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 mt-4 ml-5">
<div class="grid grid-cols-3 gap-4 p-4 bg-gray-50 rounded-xl">
  <!-- Header: Spans all 3 columns -->
  <div class="col-span-3 bg-blue-500 text-white p-4 rounded-lg font-bold text-center">
    Header (col-span-3)
  </div>

  <!-- Sidebar: Spans 1 column default -->
  <div class="bg-gray-200 text-gray-700 p-4 rounded-lg font-medium text-center">
    Sidebar (1 col)
  </div>

  <!-- Main Content: Spans 2 columns -->
  <div class="col-span-2 bg-green-500 text-white p-4 rounded-lg font-medium text-center">
    Main Content (col-span-2)
  </div>

  <!-- Footer: Spans all 3 columns -->
  <div class="col-span-3 bg-gray-800 text-white p-4 rounded-lg font-bold text-center">
    Footer (col-span-3)
  </div>
</div>
<div class="grid grid-rows-3 grid-flow-col gap-4 p-4 bg-gray-50 rounded-xl h-64">
  <!-- Tall Sidebar: Spans down all 3 rows vertically -->
  <div class="row-span-3 bg-indigo-600 text-white p-4 rounded-lg font-bold flex items-center justify-center">
    Sidebar (row-span-3)
  </div>

  <!-- Top Right Box -->
  <div class="bg-amber-500 text-white p-4 rounded-lg font-medium flex items-center justify-center">
    Box 1
  </div>

  <!-- Middle Right Box: Spans 2 rows vertically -->
  <div class="row-span-2 bg-teal-500 text-white p-4 rounded-lg font-medium flex items-center justify-center">
    Box 2 (row-span-2)
  </div>
</div>


</body>
</html>
